# Production (Hetzner CX23) — pull pre-built images from GHCR, Nginx out front.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Nginx (host) terminates TLS (Let's Encrypt via certbot) and path-splits:
#   dsideos.divinesideai.com/api/* -> localhost:8000 (api container)
#   dsideos.divinesideai.com/*     -> frontend:3000 (if frontend service is running)
#
# Set DSIDEOS_IMAGE_TAG to pin a version (CI sets it to the commit sha).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    image: ghcr.io/divineside/dsideos-api:${DSIDEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
    depends_on:
      - redis

  worker:
    image: ghcr.io/divineside/dsideos-worker:${DSIDEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # CX23 is 4GB RAM — concurrency=2 keeps LibreOffice + Claude calls within budget.
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
      # Client branded assets (IP — not in the image). Provisioned on the server.
      # Mounted at DsideOS/resources|templates — where the pipeline code (moved
      # into DsideOS 2026-07-27) actually resolves BASE/resources|templates to.
      - ./assets/resources:/app/DsideOS/resources:ro
      - ./assets/templates:/app/DsideOS/templates:ro
      # Licensed Kruti Dev fonts (gitignored, not in image) - needed by
      # LibreOffice to render the Hindi paper PDF correctly.
      - ./assets/fonts:/usr/share/fonts/truetype/dsideos:ro
    depends_on:
      - redis

  beat:
    image: ghcr.io/divineside/dsideos-worker:${DSIDEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
    depends_on:
      - redis

  # ── frontend ────────────────────────────────────────────────────────────────
  # ⚠ DECLARED BUT NOT RUNNING (verified on the box 2026-09-17). No frontend
  # container exists in production and nginx never proxies to it: the landing
  # page is served as STATIC FILES from /var/www/dsideos-landing, and the
  # console container (below, :3001) serves /r/ /f/ /g/ /_next/ and the public
  # API paths. This declaration is what made DEPLOY.md's routing description
  # wrong — either publish the image and point nginx at it, or delete this
  # service. Do not assume it is live because it is listed here.
  #
  # The dashboard lives in its OWN repo + image. This service just runs that
  # published image alongside the backend so Nginx can route to it. Update the
  # image ref to your frontend's GHCR path. Until it's published, comment this
  # out and Nginx's /* handler will 502 (the /api/* path still works).
  frontend:
    image: ghcr.io/divineside/dsideos-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # The frontend calls the backend at the same origin under /api.
      - NEXT_PUBLIC_API_BASE=/api
    depends_on:
      - api

  # ── DSideOS console (Next.js, server-side auth + backend proxy) ──
  console:
    image: ghcr.io/divineside/dsideos-console:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.console
    depends_on:
      - api

volumes:
  jobs:
  redis-data:
