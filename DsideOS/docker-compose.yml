# Local development — build from source, hot-reload, shared jobs volume.
#   cd DsideOS && docker compose up --build
# (build context is the repo root so images can copy the pipeline)
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: DsideOS/api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
      - ./api:/app/DsideOS/api          # hot-reload API code
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: DsideOS/worker/Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
      # Client branded assets — gitignored IP, so not in the image. Source of
      # truth stays at clients/target-academy/ (client-owned); mounted at
      # DsideOS/resources|templates because that's where the pipeline code
      # (moved into DsideOS 2026-07-27) actually resolves BASE/resources and
      # BASE/templates to. Prod mounts them the same way (docker-compose.prod.yml).
      - ../clients/target-academy/resources:/app/DsideOS/resources:ro
      - ../clients/target-academy/templates:/app/DsideOS/templates:ro
    depends_on:
      - redis

  beat:
    build:
      context: ..
      dockerfile: DsideOS/worker/Dockerfile
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOBS_DIR=/data/jobs
    env_file:
      - .env
    volumes:
      - jobs:/data/jobs
    depends_on:
      - redis

volumes:
  jobs:
