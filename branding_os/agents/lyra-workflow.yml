name: LYRA
description: Script writing agent for Branding OS. Takes a content idea and writes the full script — words, arc, emotional beats, pacing, delivery.

trigger:
  type: HTTP POST
  endpoint: /lyra
  source: n8n LYRA workflow (HTTP Request node)
  payload: [username, message, author_id, channel_id, message_id]

steps:

  - name: Clean Message
    action: Strip bot mention tag from raw Discord message

  - name: Brain Router
    action: Classify message complexity and select model
    primary: OpenRouter (openai/gpt-oss-120b:free)
    fallback: OpenAI GPT-4o-mini
    default: claude-sonnet-4-6 (scripting needs deep reasoning)
    output: claude-sonnet-4-6 OR gpt-4o-mini

  - name: Load KB Cache
    action: Check Redis for previously fetched Kallaway KB records
    key_pattern: lyra:kb_context:<categories>
    ttl: 1 hour
    hit: Inject cached records as system message — agent skips tool call
    miss: Agent will call the KB tool during the loop

  - name: Load Conversation History
    action: Fetch last 15 user/assistant turns from Supabase (lyra_messages table)

  - name: Build Messages
    action: Assemble final messages array — KB context (if cached) + history + new user message

  - name: Agentic Loop
    model: claude-sonnet-4-6 (Anthropic SDK) OR gpt-4o-mini (OpenAI/OpenRouter SDK)
    max_tokens: 4096 (scripts need more space than ideas)
    tool:
      name: search_knowledge_base
      categories: [Story Structure, Scripting, Delivery]
      source: Supabase (branding_knowledge_base table)
      on_fetch: Save results to Redis cache (1 hour TTL)
    loop: Continues until model produces final script with no tool calls

  - name: Save Turn
    action: Write user message + assistant reply to Supabase (lyra_messages table)

  - name: Send Discord Reply
    action: POST script to Discord channel as LYRA bot, threaded as reply to original message
