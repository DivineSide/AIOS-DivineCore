# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER LIBRARY TEMPLATE — Fill in for any ICP
# Used by: execution/enrich/enrich-leads-us.py
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT THIS IS
#   Seasonal and industry triggers that become the opener line (col V) for leads
#   where no specific site signal is found. The enrichment script rotates through
#   these per lead (row % len(triggers)), so different leads get different openers.
#
# WHY NOT TAGLINES
#   Website taglines were removed as openers — they create non-sequiturs when the
#   tagline doesn't connect to the pain being described in the email body.
#   Seasonal triggers are always relevant, timely, and lead naturally into the pain.
#
# HOW TO WRITE GOOD TRIGGERS
#   - Must be timely — reference something happening NOW (season, market event, trend)
#   - Must connect naturally to your core pain point
#   - Must NOT make claims you can't verify (no "your Facebook ads are live")
#   - Should be 1-2 sentences max
#   - No em-dashes (—)
#   - Write 4-6 triggers per ICP — rotate to keep fresh
#
# UPDATE FREQUENCY
#   Review and refresh every 4-6 weeks. Seasonal triggers lose relevance fast.
#   Store date-stamped versions when you update: trigger-library-us-2026-05.yaml
#
# EXAMPLES OF GOOD TRIGGERS
#   "Summer is the busiest season for aesthetic treatments — patients are reaching
#    out to multiple clinics right now and booking with whoever responds first."
#
#   "Spring is the most active home buying season of the year — buyers are reaching
#    out to multiple brokerages and signing with whoever responds first."
#
#   "End of Q2 is when dealerships push hardest to hit targets — most test drive
#    requests that come in after hours never get a response."
#
# EXAMPLES OF BAD TRIGGERS (do not use)
#   "Your Facebook ads are live right now" — can't verify
#   "I saw you've been running since 2008" — explicit research claim
#   "I looked at your website and noticed..." — explicit research claim
#   "Most clinics in your area..." — generic, not about them
# ─────────────────────────────────────────────────────────────────────────────

<YOUR_ICP_CODE>:   # e.g. aesthetic-clinic-us, car-dealership-us
  triggers:
    - "<FILL_IN: seasonal trigger 1 — e.g. peak season starting>"
    - "<FILL_IN: seasonal trigger 2 — e.g. end of quarter/year push>"
    - "<FILL_IN: seasonal trigger 3 — e.g. industry event or market shift>"
    - "<FILL_IN: seasonal trigger 4 — e.g. buyer behaviour trend>"
    - "<FILL_IN: seasonal trigger 5 — e.g. competitive urgency angle>"
