name: DsideOS CI/CD

# Test -> build+push images to GHCR -> SSH deploy to Hetzner. Runs on changes to
# the backend or the pipeline it bundles. PRs run tests + build only (no push,
# no deploy). Push to main does the full pipeline.
on:
  push:
    branches: [main]
    paths:
      - "DsideOS/**"
      - "clients/target-academy/pipeline/**"
      - ".github/workflows/dsideos-ci.yml"
  pull_request:
    paths:
      - "DsideOS/**"
      - "clients/target-academy/pipeline/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. test: imports compile, font switch + pipeline smoke ──────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r DsideOS/worker/requirements.txt
          pip install -r DsideOS/api/requirements.txt

      - name: Compile-check all modules
        run: |
          python -m py_compile \
            clients/target-academy/pipeline/krutidev.py \
            clients/target-academy/pipeline/build_paper.py \
            clients/target-academy/pipeline/build_paper_format2.py \
            clients/target-academy/pipeline/build_deck.py \
            clients/target-academy/pipeline/build_solution.py \
            clients/target-academy/pipeline/build_answer_key.py \
            clients/target-academy/pipeline/run_pipeline.py \
            clients/target-academy/pipeline/extract_docx.py \
            clients/target-academy/pipeline/generate_solutions.py \
            DsideOS/worker/tasks.py DsideOS/api/main.py

      - name: Font switch self-tests (krutidev.py)
        run: python clients/target-academy/pipeline/krutidev.py

      - name: Backend imports + route registration
        env:
          PYTHONPATH: ${{ github.workspace }}/DsideOS
          JOBS_DIR: /tmp/jobs
        run: |
          python - <<'PY'
          from worker.celery_app import celery_app
          from worker import tasks
          from api.main import app
          tnames = [n for n in celery_app.tasks if n.startswith("worker")]
          routes = sorted(r.path for r in app.routes if getattr(r, "path", "").startswith("/api"))
          assert "worker.tasks.full" in tnames, tnames
          assert "/api/full" in routes, routes
          assert "/api/extract" in routes, routes
          print("OK tasks:", tnames)
          print("OK routes:", routes)
          PY

  # ── 2. build + push api/worker images to GHCR ───────────────────────────────
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DsideOS/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/divineside/dsideos-${{ matrix.component }}:latest
            ghcr.io/divineside/dsideos-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=dsideos-${{ matrix.component }}
          cache-to: type=gha,scope=dsideos-${{ matrix.component }},mode=max

  # ── 3. deploy: SSH to Hetzner, pull the new sha, restart ────────────────────
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /root/DsideOS
            export DSIDEOS_IMAGE_TAG=sha-${{ github.sha }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull api worker beat
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

  # ── 4. notify #deploys ───────────────────────────────────────────────────────
  notify:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ DsideOS deployed to Hetzner: \`sha-${{ github.sha }}\`\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
