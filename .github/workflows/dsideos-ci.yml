name: DsideOS CI/CD

# Test -> build+push images to GHCR -> SSH deploy to Hetzner. Runs on changes to
# the backend or the pipeline it bundles. PRs run tests + build only (no push,
# no deploy). Push to main does the full pipeline.
# (no-op touch to trigger a deploy and verify the Discord webhook secret - retry)
on:
  push:
    branches: [main]
    paths:
      - "DsideOS/**"
      - "clients/target-academy/pipeline/**"
      - ".github/workflows/dsideos-ci.yml"
  pull_request:
    paths:
      - "DsideOS/**"
      - "clients/target-academy/pipeline/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. test: imports compile, font switch + pipeline smoke ──────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r DsideOS/worker/requirements.txt
          pip install -r DsideOS/api/requirements.txt

      - name: Compile-check all modules
        run: |
          python -m py_compile \
            clients/target-academy/pipeline/krutidev.py \
            clients/target-academy/pipeline/build_paper.py \
            clients/target-academy/pipeline/build_paper_format2.py \
            clients/target-academy/pipeline/build_deck.py \
            clients/target-academy/pipeline/build_solution.py \
            clients/target-academy/pipeline/build_answer_key.py \
            clients/target-academy/pipeline/run_pipeline.py \
            clients/target-academy/pipeline/extract_docx.py \
            clients/target-academy/pipeline/generate_solutions.py \
            clients/target-academy/rag/query.py \
            DsideOS/worker/generate.py \
            DsideOS/worker/tasks.py DsideOS/api/main.py

      - name: Font switch self-tests (krutidev.py)
        run: python clients/target-academy/pipeline/krutidev.py

      - name: Backend imports + route registration
        env:
          PYTHONPATH: ${{ github.workspace }}/DsideOS
          JOBS_DIR: /tmp/jobs
        run: |
          python - <<'PY'
          from worker.celery_app import celery_app
          from worker import tasks
          from api.main import app
          tnames = [n for n in celery_app.tasks if n.startswith("worker")]
          routes = sorted(r.path for r in app.routes if getattr(r, "path", "").startswith("/api"))
          assert "worker.tasks.full" in tnames, tnames
          assert "worker.tasks.generate" in tnames, tnames
          assert "/api/full" in routes, routes
          assert "/api/extract" in routes, routes
          assert "/api/generate" in routes, routes
          print("OK tasks:", tnames)
          print("OK routes:", routes)
          PY

  # ── 2. build + push api/worker images to GHCR ───────────────────────────────
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DsideOS/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/divineside/dsideos-${{ matrix.component }}:latest
            ghcr.io/divineside/dsideos-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=dsideos-${{ matrix.component }}
          cache-to: type=gha,scope=dsideos-${{ matrix.component }},mode=max

  # ── 3. deploy: SSH to Hetzner, pull the new sha, restart ────────────────────
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /root/DsideOS
            TAG=sha-${{ github.sha }}
            export DSIDEOS_IMAGE_TAG=$TAG
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull api worker beat
            # the compose api/worker images default to :latest when the env var
            # isn't present (e.g. a manual `compose up` later). Re-point :latest at
            # the just-deployed sha so the running containers never drift back to a
            # stale image. Then force-recreate the backend services.
            docker tag ghcr.io/divineside/dsideos-api:$TAG    ghcr.io/divineside/dsideos-api:latest
            docker tag ghcr.io/divineside/dsideos-worker:$TAG ghcr.io/divineside/dsideos-worker:latest
            docker compose -f docker-compose.prod.yml up -d --force-recreate api worker beat
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

  # ── 4. notify #deploys ───────────────────────────────────────────────────────
  notify:
    needs: deploy
    # run even if deploy failed, so we always get a ping (and see failures)
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual trigger' }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        # Write the script to a file (no inline-quoting fragility), and DON'T
        # swallow errors silently — log clearly so a missing/blank webhook or a
        # bad commit message is visible in the Actions log instead of "nothing
        # pinged". The step itself stays non-fatal via continue-on-error.
        continue-on-error: true
        run: |
          cat > notify.py <<'PY'
          import json, os, sys, urllib.request

          hook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not hook:
              print("::warning::DISCORD_WEBHOOK_URL secret is empty or not set — "
                    "add it in repo Settings > Secrets > Actions. Skipping ping.")
              sys.exit(0)
          # SAFE fingerprint to diagnose a wrong/stale secret WITHOUT leaking the
          # token: log the length + the webhook ID (the numeric path segment,
          # which is not the secret — the secret is the token AFTER it). If this
          # ID != 1520700531071389807 (the URL we verified works), the secret
          # holds the wrong URL. Remove this block once confirmed.
          import re as _re
          _m = _re.search(r"/webhooks/(\d+)/", hook)
          _wid = _m.group(1) if _m else "NO-ID-FOUND"
          print(f"[notify-debug] webhook len={len(hook)} id={_wid} "
                f"host={hook.split('/')[2] if '://' in hook else '?'}")

          ok = os.environ.get("DEPLOY_RESULT") == "success"
          payload = {
              "embeds": [{
                  "title": "✅ DsideOS deployed" if ok else "❌ DsideOS deploy failed",
                  "color": 3066993 if ok else 15158332,
                  "fields": [
                      {"name": "Commit", "value": (os.environ.get("COMMIT_MSG") or "—")[:1000], "inline": False},
                      {"name": "By",     "value": os.environ.get("ACTOR", "—"),      "inline": True},
                      {"name": "SHA",    "value": os.environ.get("SHA", "")[:7],     "inline": True},
                  ],
              }]
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(hook, data=data,
                headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"Discord responded {r.status}")
          except Exception as e:
              print(f"::error::Discord ping failed: {type(e).__name__}: {e}")
              sys.exit(1)
          PY
          python3 notify.py
