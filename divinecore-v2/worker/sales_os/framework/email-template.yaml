# ─────────────────────────────────────────────────────────────────────────────
# EMAIL TEMPLATE — Fill in for any ICP
# Based on: Mendoza 4-Question Framework
# Used by: scripts/generate-copy-us.py and scripts/generate-copy-dach.py
# ─────────────────────────────────────────────────────────────────────────────
#
# HOW THE COPY ENGINE WORKS
#   1. Enrichment script scrapes each lead's website → assigns signal (col U) + phrase (col V)
#   2. generate-copy script reads U + V, builds opener_line, fills this template
#   3. Finished email written to sheet columns W (subject) X (body) Y (subject2) Z (body2)
#
# THE 4-PART STRUCTURE (Mendoza framework)
#   Q1 OPENER:     {{opener_line}} — seasonal trigger or site-specific signal. NO "your site says".
#                  The enrichment script builds this from col V. Never write it manually.
#   Q3 PAIN/VALUE: State the pain directly about THEM ("you could be losing..."), add stat if relevant
#   Q2 AUTHORITY:  Descriptive — name what you build, for which niche, what it does
#   Q4 CTA:        One low-friction ask. Keep it locked — don't get creative here.
#
# RULES (non-negotiable)
#   - Word count: 150-200 words (first_touch body)
#   - No em-dashes (—) anywhere in the copy
#   - No "your site says X" / "just looked at your site" / "running since YEAR"
#   - No "No one in your market" → use "No one ELSE in your market"
#   - Pain lines must say "you could be..." not "most [ICPs]..."
#   - Subject line: clear about what you sell, not "Quick question"
#   - Second touch: add a NEW angle, not just "did you get my email?"
#
# AVAILABLE PLACEHOLDERS
#   {{first_name}}     — lead's first name
#   {{opener_line}}    — built automatically from col V by the enrichment script
#   {{company_name}}   — lead's company name
#   {{founded_year}}   — year company was founded (from Apollo scrape data)
#
# SIGNAL TYPES — use exactly these names:
#   pain_fwd_reception    — no instant response / no booking widget
#   pain_fwd_reactivation — past customers sitting cold in database
#   pain_fwd_speed        — running ads but slow to respond
#   pain_fwd_upsell       — broad offering but no automated cross-sell
#   fallback              — no specific signal found
#
# PAIN COMBOS (enrichment picks the best 2 of 3 per lead)
#   reception → pair with reactivation
#   reactivation → pair with upsell
#   speed → pair with reactivation
#   upsell → pair with reactivation
#   fallback → speed + reactivation (most universal)
# ─────────────────────────────────────────────────────────────────────────────

---

signal_type: pain_fwd_reception

first_touch:
  subject: "<FILL_IN — specific to pain, e.g. 'missed inquiries, {{first_name}}'>"
  body: |
    Hey {{first_name}},

    {{opener_line}}

    <PAIN LINE 1 — speed to lead>
    You could be losing [ICP-specific] inquiries every time your team is unavailable. Data shows
    businesses that respond within 5 minutes are 391% more likely to close them.

    <PAIN LINE 2 — reactivation>
    On top of that, the [customers/patients/clients] who [visited/closed/bought] 6-12 months ago
    and never heard back? That is 40-80% of your [ICP] base sitting cold in the database right now.

    <AUTHORITY — descriptive, niche-specific>
    We build two systems for [ICP niche] across the [region]: an AI response engine that contacts
    every new inquiry within minutes before they go elsewhere, and a reactivation engine that
    automatically re-engages past [customers/patients/clients], turning dormant contacts back into
    [booked appointments/closed deals/revenue].

    No one else in your market is running this yet.

    <CTA>
    Worth a quick 15-min call this week?

    <YOUR_NAME>
    <YOUR_COMPANY>

second_touch:
  subject: "Re: <SAME AS first_touch subject>"
  body: |
    Hey {{first_name}},

    just following up. Last note from me.

    <NEW ANGLE — mention the second pain point not covered in email 1>

    Worth a quick 10 min?

    <YOUR_NAME>

---

