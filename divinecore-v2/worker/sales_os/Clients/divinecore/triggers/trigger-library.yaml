# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER LIBRARY — DivineSide / Marketing OS / Ecommerce
#
# These triggers are used ONLY for the fallback signal type — when no specific
# signal (product launch, ad pixel, founding year) is detected on the site.
#
# RULES:
#   - Every trigger must frame the season as a Meta account risk, not just a
#     business observation. The trigger IS the opener — it must flow directly
#     into the pain/value copy that follows.
#   - No em-dashes anywhere
#   - 2-3 sentences max
#   - Must connect to our product without naming it
#   - Rotate by row index (pick_trigger uses row % len)
#   - Update every 4-6 weeks to stay current
#
# STRUCTURE: keyed by ICP name (matches the --icp argument)
# ─────────────────────────────────────────────────────────────────────────────

ecommerce-uk:
  triggers:
    - >
      Q4 is when most ecommerce brands double their Meta spend. It is also when
      creative fatigue and dead campaigns compound the fastest. Most find out
      what went wrong in January.

    - >
      Most ecommerce brands are still running Q4 creatives in January. Audiences
      have seen the same ads 15 to 20 times and ROAS is quietly collapsing with
      no clear signal in Ads Manager.

    - >
      Spring is when most ecommerce brands refresh their product range but forget
      to audit the Meta account running behind it. Old creatives, stale audiences,
      and dead campaigns keep spending through the new season.

    - >
      Summer is when Meta performance drops for most ecommerce brands. Usually it
      is not the season. It is creative fatigue that has been building since Q4
      and compounds when audiences are shown the same ads through a new quarter.

    - >
      Back to school is one of the highest-spend windows for ecommerce brands in
      apparel, health, and consumer goods. It is also when accounts carrying
      undetected issues from the summer see the biggest performance gap.

    - >
      Valentine's Day and gifting moments are short windows. Brands that push
      spend hard into a campaign structure with overexposed audiences and stale
      creatives burn budget on the days it matters most.

