# ── PAIN QUESTIONS ────────────────────────────────────────────────────────────
# Used by generate-copy-us.py to match signal types from column U
pain_questions:
  new_product_launch: >
    Quick question — with a new product just out, how are you tracking whether
    your Meta campaigns are ready to support additional spend, or whether
    existing campaigns are already wasting budget?

  active_meta_spender: >
    Quick question — how are you currently tracking which Meta campaigns are
    wasting budget vs which ones are actually driving conversions?

  mature_ad_account: >
    Quick question — how are you currently spotting creative fatigue and
    underperforming campaigns before they drain a significant chunk of your
    monthly Meta spend?

  complex_ad_account: >
    Quick question — with multiple product lines on Meta, how are you getting
    a clear view of which campaigns are driving profitable revenue vs which
    are just generating spend?

  fallback: >
    Quick question — how are you currently getting visibility into what is and
    is not working across your Meta account each week?

# ── SIGNAL FALLBACK PHRASES ───────────────────────────────────────────────────
signal_fallbacks:
  speed: >
    running Meta ads without a clear system for catching wasted spend before
    it compounds

  reactivation: >
    an established ad account that has likely accumulated creative fatigue and
    underperforming campaigns that standard Ads Manager reporting does not surface

  upsell: >
    running multiple product campaigns with no unified view of which are driving
    profitable revenue vs which are generating spend with no return

# ── COPY QUALITY GATE ─────────────────────────────────────────────────────────
quality_gate:
  max_words: 150
  no_ai_mention: false
