---

## Setup Steps

### Step 1 — Install Cowork
Download and install the Claude Cowork desktop app. Sign in with your Anthropic/Claude account.

### Step 2 — Install the Claude in Chrome plugin
The automation controls your Chrome browser. In Cowork, go to **Plugins** and install **Claude in Chrome**. Enable it in chat.

### Step 3 — Log LinkedIn into Chrome
Open Chrome and make sure you're logged into the LinkedIn account that will be sending the connection requests. The automation will pause and alert you if it hits a login wall.

### Step 4 — Create the scheduled task
Open a new Cowork conversation and send this message exactly:

> Set up a daily scheduled task that runs every morning at 9:00 AM my local timezone with the following prompt:

Then paste the full task prompt from the section below.

### Step 5 — Pre-approve Chrome tool permissions
After creating the task, click **Run now** from the Scheduled sidebar. Approve each Chrome permission dialog that appears (navigate, click, screenshot, JavaScript). You'll only see these once — all future 9 AM runs will be fully automatic.

