## The Scheduled Task Prompt

Copy everything inside the code block below and paste it after the message in Step 4.

```
You are running the daily LinkedIn outreach pipeline. Follow every step exactly.

═══════════════════════════════════════════
API CONFIGURATION
═══════════════════════════════════════════
Base URL:  https://mayank-rawat--linkedin-outreach-service-web.modal.run
Auth header (every request): Authorization: Bearer -0nZC9v0Qp6_01HxUVAnxSo6ozd18v1GZn1TqYR_cwA

CRITICAL — TWO-TAB ARCHITECTURE:
LinkedIn blocks cross-origin XHR from its own domain. You must maintain exactly two tabs:
  • TAB A — LinkedIn tab: used ONLY for navigating LinkedIn profiles
  • TAB B — Neutral tab (Google or similar): used ONLY for all API calls (/fetch and /update)
Never make API calls from the LinkedIn tab. Never navigate away from LinkedIn in TAB A.

All API calls use XMLHttpRequest (not fetch) from TAB B, like this:
  new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '<URL>', true);
    xhr.setRequestHeader('Authorization', 'Bearer -0nZC9v0Qp6_01HxUVAnxSo6ozd18v1GZn1TqYR_cwA');
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 20000;
    xhr.onload = () => resolve({status: xhr.status, body: xhr.responseText});
    xhr.onerror = () => reject('Network error');
    xhr.ontimeout = () => reject('Timeout');
    xhr.send(/* JSON body or null */);
  })

Modal returns HTTP 303 redirects — XHR handles this automatically.

═══════════════════════════════════════════
STEP 1 — SETUP TABS
═══════════════════════════════════════════
1a. Use tabs_context_mcp (createIfEmpty: true) to get existing tabs.
1b. Check if LinkedIn is already open in a tab. If not, create a new tab and navigate it to https://www.linkedin.com.
1c. Create a second tab and navigate it to https://www.google.com (this is your API tab).
1d. Verify LinkedIn shows the feed (not a login page). If it shows a login page, STOP and notify the user: "LinkedIn is not logged in. Please log in to LinkedIn in Chrome and re-run the task."

═══════════════════════════════════════════
STEP 2 — FETCH LEADS
═══════════════════════════════════════════
From TAB B (Google tab), call POST /fetch with no body.

Response shape:
  {
    "leads": [ { row_num, first_name, last_name, company_name, job_title,
                 linkedin_url, email_context, priority, message, ... } ],
    "sent_today": N,
    "sent_this_week": N,
    "remaining_today": N
  }

If leads array is empty: print the summary (sent_today, remaining_today) and exit. Done.

Store the full leads array. You will process them in order.

═══════════════════════════════════════════
STEP 3 — PROCESS EACH LEAD
═══════════════════════════════════════════
For each lead in array order:

── 3a. NAVIGATE ──
In TAB A (LinkedIn tab), navigate to lead's linkedin_url.
Wait for page to fully load.

── 3b. VERIFY NAME ──
Read the page heading. The visible name must match first_name + last_name from the lead data.
Minor spelling variants (e.g. "Micheal" vs "Michael") count as a match — use judgment.
If clearly a different person: call POST /update from TAB B:
  { "row": <row_num>, "status": "failed", "notes": "Profile name mismatch" }
Move to next lead.

── 3c. CHECK CONNECTION STATUS ──
Inspect the profile header buttons:
  • "1st" badge next to name → already connected.
    Call /update: { "row": row_num, "status": "already_connected", "notes": "Already connected" }
    Move to next.
  • "Pending" button or "Cancel request" in profile actions → already pending.
    Call /update: { "row": row_num, "status": "already_pending", "notes": "Invitation already pending" }
    Move to next.
  • Otherwise → proceed to 3d.

── 3d. FIND CONNECT BUTTON ──
Look for a Connect button directly in the profile header actions (near Message/Follow buttons).
CRITICAL: Only click Connect buttons belonging to THIS profile — never click Connect from sidebar
sections like "People you may know", "More profiles for you", or "People similar to X".
Those send the request to the wrong person.

If Connect is not visible directly:
  Click the "More" button in the profile actions area.
  Look for "Connect" inside the dropdown that opens.

To find the correct "More" button: use JavaScript to list all buttons with text "More" and their
positions. The profile header More button is typically at y ≈ 100–200px from the top
(not y < 10, which is the nav bar).

  const allButtons = Array.from(document.querySelectorAll('button'));
  const moreButtons = allButtons.filter(b => b.innerText.trim() === 'More');
  const results = moreButtons.map((b, i) => {
    const rect = b.getBoundingClientRect();
    return { index: i, top: Math.round(rect.top), left: Math.round(rect.left) };
  });
  JSON.stringify(results);

Click the one at y ≈ 100–200, then look for Connect in the dropdown.

If no Connect option anywhere:
  Call /update: { "row": row_num, "status": "skipped", "notes": "No Connect option available" }
  Move to next.

── 3e. HANDLE SALES NAV POPUP ──
If a Sales Navigator or Premium upsell popup appears (text contains "Sales Navigator" or
"Try Premium"), click Dismiss and retry finding Connect.
If still blocked:
  Call /update: { "row": row_num, "status": "skipped", "notes": "Sales Nav upsell blocked connect" }
  Move to next.

── 3f. SEND THE INVITATION WITH NOTE ──
After clicking Connect, a modal appears: "Add a note to your invitation?"
  1. Click "Add a note" (not "Send without a note")
  2. Click inside the text area
  3. Type the lead's `message` field EXACTLY as provided. Do not modify it.
  4. Click the Send button (label may be "Send invitation", "Send", or "Send now")

Note: The modal may take 1–2 seconds to fully render. If it shows a loading state, wait and retry.

── 3g. VERIFY ──
Wait 3 seconds.
Navigate TAB A back to the same linkedin_url.
Scroll down to the profile action buttons area.

  • If "Pending" confirmed → call /update from TAB B:
      { "row": row_num, "status": "sent", "message_sent": "<exact message typed>" }
  • If still shows "Connect" → call /update:
      { "row": row_num, "status": "failed", "notes": "Send click did not result in pending" }

── 3h. WAIT BETWEEN LEADS ──
Before moving to the next lead, wait a random 30–60 seconds to keep activity looking human.

═══════════════════════════════════════════
STEP 4 — STOP CONDITIONS
═══════════════════════════════════════════
Stop early if:
  • All leads processed
  • 3 consecutive failures — call /update on the last one with reason, then stop

═══════════════════════════════════════════
STEP 5 — SUMMARY
═══════════════════════════════════════════
Print at the end:

  ✅ LinkedIn Outreach Run Complete
  Sent:    X
  Skipped: Y  (breakdown by reason)
  Failed:  Z  (breakdown by reason)
  Total processed: X+Y+Z
  Remaining today (per API): N
